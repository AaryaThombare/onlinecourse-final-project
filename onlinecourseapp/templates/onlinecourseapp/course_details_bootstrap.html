
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ course.name }} - Course Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Online Learning Platform</span>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">{{ course.name }}</h2>
            </div>

            <div class="card-body">
                <h4 class="mb-3">Course Lessons</h4>

                <div class="list-group">
                    {% for lesson in course.lessons.all %}
                        <div class="list-group-item">
                            <h5>{{ lesson.title }}</h5>
                            <p class="mb-0">{{ lesson.content }}</p>
                        </div>
                    {% empty %}
                        <div class="list-group-item">
                            No lessons are available for this course.
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
